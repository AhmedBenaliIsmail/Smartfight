parameters:
    env(DEEPSEEK_API_KEY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Service\AIService:
        arguments:
            $deepseekApiKey: '%env(DEEPSEEK_API_KEY)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'