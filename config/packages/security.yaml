security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
            custom_authenticators:
                - App\Security\GoogleAuthenticator

    access_control:
        # Public: auth & registration
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        # Admin-only paths
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/stats/new, roles: ROLE_ADMIN }
        - { path: ^/stats/delete, roles: ROLE_ADMIN }
        - { path: ^/stats/delete-fight, roles: ROLE_ADMIN }
        # Authenticated users
        - { path: ^/stats, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/predictions, roles: ROLE_USER }
        - { path: ^/bookings, roles: ROLE_USER }
        # Everything else is public (fighters, events, blog, etc.)
